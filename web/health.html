<title>健康证公示 · 塔斯汀农大金山校区店</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f4f4f5;
    color: #1f2329;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    /* 锁定整页缩放：保留单指滚动，双指缩放由 zoom-lock.js 兜底 */
    touch-action: pan-x pan-y;
  }
  #health-app { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  .muted { color: #8a9099; }
  .center { text-align: center; }

  .page-head {
    background: #fff;
    border-radius: 14px;
    padding: 20px 18px 16px;
    border-top: 4px solid #E10600;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .brand { font-size: 12px; letter-spacing: 2px; color: #E10600; font-weight: 700; }
  .page-title { margin: 6px 0 4px; font-size: 24px; letter-spacing: 1px; }
  .page-sub { margin: 0; font-size: 13px; color: #6b7280; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .sum-cell {
    background: #fff; border-radius: 12px; padding: 12px 8px; text-align: center;
    border: 1px solid #ececee;
  }
  .sum-num { display: block; font-size: 22px; line-height: 1.2; }
  .sum-label { font-size: 12px; color: #6b7280; }
  .sum-cell.valid .sum-num { color: #1a7f37; }
  .sum-cell.soon .sum-num { color: #b7791f; }
  .sum-cell.expired .sum-num { color: #E10600; }

  .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .seg {
    display: flex; background: #ececee; border-radius: 10px; padding: 3px; gap: 3px;
  }
  .seg-btn {
    flex: 1; border: 0; background: transparent; border-radius: 8px;
    padding: 8px 0; font-size: 13px; color: #4b5563; font-family: inherit;
  }
  .seg-btn.on { background: #fff; color: #E10600; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .select {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid #e3e4e6;
    background: #fff; font-size: 16px; font-family: inherit;
  }

  .stores { display: flex; flex-direction: column; gap: 12px; }
  .store-group { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #ececee; }
  .store-name {
    padding: 11px 16px; font-size: 13px; font-weight: 600; color: #374151;
    background: #fafafa; border-bottom: 1px solid #f0f0f1;
  }
  .list { list-style: none; margin: 0; padding: 0; }
  /* 左右布局：左侧文字可收缩省略，右侧按钮固定不被挤压 */
  .item { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #f2f2f3; }
  .item:last-child { border-bottom: 0; }
  .item-main { flex: 1 1 auto; min-width: 0; }
  .item-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name { font-size: 16px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-meta { font-size: 13px; color: #6b7280; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-hint { font-size: 12px; margin-top: 4px; color: #8a9099; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.soon .item-hint { color: #b7791f; }
  .item.expired .item-hint { color: #E10600; }

  .chip { flex: 0 0 auto; font-size: 12px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .chip.valid { color: #1a7f37; background: #eaf6ed; }
  .chip.soon { color: #9a6700; background: #fdf6e3; }
  .chip.expired { color: #b42318; background: #fdeceb; }
  .item-verify { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #8a9099; }
  .vchip { font-size: 12px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .vchip.verified { color: #1a7f37; background: #eaf6ed; }
  .vchip.rejected { color: #b42318; background: #fdeceb; }
  .vchip.none { color: #6b7280; background: #f1f2f4; }
  .mat-thumb { flex: 0 0 auto; width: 36px; height: 36px; padding: 0; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; background: #fff; cursor: pointer; }
  .mat-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mat-link { border: 0; background: none; padding: 2px 0; color: #1f6feb; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .mat-preview { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }

  .empty { padding: 18px 16px; font-size: 13px; color: #8a9099; }

  .foot { margin-top: 16px; padding: 0 4px; font-size: 12px; color: #8a9099; line-height: 1.7; }
  .foot p { margin: 4px 0; }
  .mask-note { color: #6b7280; }

  .item-side { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; }
  .link-btn {
    border: 1px solid #F7C9C7; background: #FEF5F5; color: #E10600;
    border-radius: 8px; padding: 5px 12px; font-size: 13px; font-family: inherit;
    white-space: nowrap; flex: 0 0 auto;
  }
  .no-file { font-size: 12px; color: #b0b4ba; white-space: nowrap; }

  .pdf-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  }
  .pdf-panel {
    background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0;
    padding: 14px; max-height: 94vh; display: flex; flex-direction: column;
  }
  .pdf-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; }
  .pdf-close {
    border: 0; background: #f2f2f3; color: #4b5563; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-family: inherit;
  }
  .pdf-body {
    flex: 1; min-height: 300px; background: #f4f4f5; border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .pdf-frame { width: 100%; flex: 1; min-height: 320px; border: 0; display: block; background: #fff; }
  .pdf-loading, .pdf-error { padding: 40px 16px; text-align: center; font-size: 13px; color: #8a9099; }
  .pdf-error-title { font-size: 15px; color: #1f2329; margin: 0 0 6px; }
  .pdf-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; }
  .pdf-tip { font-size: 12px; color: #8a9099; }
  .pdf-link { font-size: 13px; color: #E10600; text-decoration: none; white-space: nowrap; }
  @media (min-width: 640px) {
    .pdf-mask { align-items: center; }
    .pdf-panel { border-radius: 16px; }
  }

  .state-box {
    background: #fff; border-radius: 14px; padding: 44px 20px; text-align: center;
    border: 1px solid #ececee;
  }
  .state-icon { font-size: 30px; margin-bottom: 8px; }
  .state-title { margin: 0 0 6px; font-size: 18px; }
  .state-box p { margin: 0 0 16px; font-size: 13px; }
  .btn {
    border: 0; background: #E10600; color: #fff; border-radius: 10px;
    padding: 9px 22px; font-size: 14px; font-family: inherit;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid #eee; border-top-color: #E10600; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-color-scheme: dark) {
    body { background: #121315; color: #e8e8ea; }
    .page-head, .sum-cell, .store-group, .state-box, .select, .seg-btn.on { background: #1c1d20; }
    .page-head, .sum-cell, .store-group, .state-box { border-color: #2a2b2f; }
    .store-name { background: #202124; color: #c9cacc; border-color: #2a2b2f; }
    .item { border-color: #26272a; }
    .seg { background: #232427; }
    .select { border-color: #2f3034; color: #e8e8ea; }
    .item-meta, .page-sub, .sum-label { color: #9aa0a6; }
    .pdf-panel { background: #1c1d20; }
    .pdf-body { background: #232427; }
    .pdf-close { background: #2a2b2f; color: #c9cacc; }
    .pdf-error-title { color: #e8e8ea; }
    .link-btn { background: #2a1b1e; border-color: #5a2a32; }
  }
</style>

</head>
